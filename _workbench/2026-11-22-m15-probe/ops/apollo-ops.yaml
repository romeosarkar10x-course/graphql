supergraph:
  introspection: true
health_check:
  listen: 127.0.0.1:8088
  enabled: true
include_subgraph_errors:
  all: true
plugins:
  experimental.expose_query_plan: true
headers:
  all:
    request:
      - propagate:
          named: x-shelfie-user
      - propagate:
          named: authorization
