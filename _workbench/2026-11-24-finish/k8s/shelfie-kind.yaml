# Shelfie on Kubernetes (Module 16.4): two replicas, rolled one at a time, never below two ready.
# The image comes from Jib: mvn package jib:build -Djib.to.image=<registry>/shelfie-ops:<version>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfie
  labels: {app: shelfie}
spec:
  replicas: 2
  selector:
    matchLabels: {app: shelfie}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # start a new pod before stopping an old one
      maxSurge: 1
  template:
    metadata:
      labels: {app: shelfie}
    spec:
      # Longer than the app needs to stop: 2 s drain + up to 20 s for in-flight requests (timeout-per-shutdown-phase).
      terminationGracePeriodSeconds: 30
      containers:
        - name: shelfie
          image: shelfie-ops:deploy
          ports:
            - containerPort: 4000
          env:
            - name: SHELFIE_REVIEWS_URL
              value: http://reviews:4100
            - name: OTLP_TRACES
              value: http://tempo:4318/v1/traces
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 4000}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 4000}
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 4000}
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shelfie
spec:
  selector: {app: shelfie}
  ports:
    - port: 80
      targetPort: 4000
