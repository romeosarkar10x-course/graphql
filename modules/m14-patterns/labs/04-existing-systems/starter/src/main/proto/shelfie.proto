// The same Shelfie domain as gRPC (Module 1.4). Two styles side by side:
//  - resource RPCs (GetClub, GetUser, ...) that mirror REST and cause the same waterfall
//  - a screen RPC (GetClubPage) that a backend team must add for each new screen.
syntax = "proto3";

package shelfie.v1;

option java_multiple_files = true;
option java_package = "dev.shelfie.bff.grpc.v1";

service ShelfieService {
  rpc GetClub(GetByIdRequest) returns (Club);
  rpc GetUser(GetByIdRequest) returns (User);
  rpc GetBook(GetByIdRequest) returns (Book);
  rpc ListBookReviews(GetByIdRequest) returns (ListReviewsResponse);
  rpc GetClubPage(GetClubPageRequest) returns (ClubPage);
}

message GetByIdRequest { string id = 1; }

message GetClubPageRequest {
  string club_id = 1;
  int32 member_limit = 2;
  int32 review_limit = 3;
}

message Club {
  string id = 1;
  string name = 2;
  string description = 3;
  string owner_id = 4;
  repeated string member_ids = 5;
  string current_book_id = 6;
  string created_at = 7;
}

message User {
  string id = 1;
  string name = 2;
  string handle = 3;
  string bio = 4;
}

message Book {
  string id = 1;
  string title = 2;
  repeated string authors = 3;
  int32 published_year = 4;
}

message Review {
  string id = 1;
  string author_id = 2;
  int32 rating = 3;
  string body = 4;
  string created_at = 5;
}

message ListReviewsResponse { repeated Review reviews = 1; }

message ClubPage {
  string name = 1;
  string description = 2;
  string owner_name = 3;
  int32 member_count = 4;
  repeated string member_names = 5;
  string current_book_title = 6;
  repeated string current_book_authors = 7;
  repeated PageReview latest_reviews = 8;
  string next_meetup_title = 9;
  string next_meetup_starts_at = 10;
}

message PageReview {
  string reviewer_name = 1;
  int32 rating = 2;
  string body = 3;
}
