server.port: 4000
spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://postgres:5432/shelfie
    username: shelfie
    password: shelfie
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:course-public.pem
          issuer-uri: http://keycloak:8180/realms/shelfie
          audiences: shelfie-api
          principal-claim-name: preferred_username
          authorities-claim-name: roles
          authority-prefix: ROLE_
logging:
  level:
    dev.shelfie: INFO
