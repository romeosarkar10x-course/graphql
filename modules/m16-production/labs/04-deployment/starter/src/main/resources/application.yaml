server:
  port: 4000
spring:
  application:
    name: shelfie
  graphql:
    websocket:
      path: /graphql
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # buckets, so Prometheus can compute p95/p99 with histogram_quantile
      percentiles-histogram:
        graphql.request: true
        graphql.datafetcher: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
    metrics:
      export:
        # metrics are scraped by Prometheus; OTLP is for traces only
        enabled: false
shelfie:
  reviews:
    url: http://localhost:4100
  clients: web,ios,android,partner-bulk
