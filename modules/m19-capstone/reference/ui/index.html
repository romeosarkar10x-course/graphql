<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolshed</title>
<style>
  :root { --bg: #f7f5f0; --card: #fff; --ink: #222; --muted: #666; --accent: #2f6f4f; --out: #a33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1d1c; --card: #262928; --ink: #eee; --muted: #aaa; --accent: #6fbf8f; --out: #e77; } }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--card); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  input, select, button { font: inherit; padding: 6px 8px; }
  main { padding: 16px; max-width: 960px; margin: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 8px; padding: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .on { color: var(--accent); } .out { color: var(--out); }
  #msg { min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <h1>Toolshed</h1>
  <input id="search" placeholder="Search tools" aria-label="Search">
  <select id="category" aria-label="Category"><option value="">All categories</option></select>
  <select id="sort" aria-label="Sort"><option>NAME_ASC</option><option>NAME_DESC</option><option>NEWEST</option></select>
  <input id="token" placeholder="Bearer token (optional)" aria-label="Token" size="18">
  <button id="mine">My loans</button>
</header>
<main>
  <p id="msg" class="muted"></p>
  <div id="list" class="grid"></div>
  <p><button id="more" hidden>More</button></p>
</main>
<script>
// Every request is a persisted document id (the router refuses anything else); ids come from the manifest.
const ids = {};
let after = null;
const $ = id => document.getElementById(id);
async function gql(name, variables = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if ($('token').value) headers.Authorization = 'Bearer ' + $('token').value.trim();
  const res = await fetch('/graphql', { method: 'POST', headers, body: JSON.stringify({ documentId: ids[name], variables }) });
  const body = await res.json();
  if (body.errors) $('msg').textContent = body.errors.map(e => e.message).join('; ');
  return body.data;
}
function card(t) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<strong></strong><div class="muted"></div><div class="state"></div><button>Borrow</button>`;
  div.querySelector('strong').textContent = t.name;
  div.querySelector('.muted').textContent = `${t.specs.summary} · ${t.category.name} · ${t.branch.name}`;
  const state = div.querySelector('.state');
  // null: lending could not answer; say so instead of guessing
  const show = on => { state.textContent = on == null ? 'Ask at the desk' : on ? 'On the shelf' : 'Out'; state.className = 'state ' + (on == null ? 'muted' : on ? 'on' : 'out'); };
  show(t.available);
  div.querySelector('button').onclick = async () => {
    const r = await gql('BorrowTool', { input: { toolId: t.id, days: 7, idempotencyKey: crypto.randomUUID() } });
    if (r) $('msg').textContent = r.borrowTool.__typename === 'Borrowed' ? `Borrowed ${t.name}, due ${r.borrowTool.loan.dueAt.slice(0, 10)}` : r.borrowTool.message;
  };
  watch(t.id, show);
  return div;
}
// The live badge: the Availability subscription over server-sent events, through the router.
async function watch(toolId, show) {
  const res = await fetch('/graphql', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
    body: JSON.stringify({ documentId: ids.Availability, variables: { toolId } }) });
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    for (const line of value.split('\n')) if (line.startsWith('data:')) {
      const data = JSON.parse(line.slice(5)).data;
      if (data) show(data.availabilityChanged.available);
    }
  }
}
async function load(reset) {
  if (reset) { after = null; $('list').replaceChildren(); }
  const filter = $('category').value ? { categoryId: $('category').value } : null;
  const d = await gql('ToolPage', { first: 12, after, filter, sort: $('sort').value });
  if (!d) return;
  $('msg').textContent = `${d.tools.totalCount} tools`;
  d.tools.edges.forEach(e => $('list').append(card(e.node)));
  after = d.tools.pageInfo.endCursor;
  $('more').hidden = !d.tools.pageInfo.hasNextPage;
}
async function start() {
  const manifest = await (await fetch('/persisted-documents.json')).json();
  for (const [id, doc] of Object.entries(manifest)) ids[/^(query|mutation|subscription)\s+(\w+)/m.exec(doc)[2]] = id;
  const f = await gql('Filters');
  f.categories.forEach(c => $('category').append(new Option(`${c.name} (${c.toolCount})`, c.id)));
  $('category').onchange = $('sort').onchange = () => load(true);
  $('more').onclick = () => load(false);
  $('search').onchange = async () => {
    if (!$('search').value) return load(true);
    const d = await gql('Search', { text: $('search').value });
    $('list').replaceChildren(...d.search.map(r => { const c = document.createElement('div'); c.className = 'card'; c.textContent = `${r.__typename}: ${r.name}`; return c; }));
    $('more').hidden = true;
  };
  $('mine').onclick = async () => {
    const d = await gql('MyLoans');
    if (!d || !d.me) { $('msg').textContent = 'Paste a token to see your loans.'; return; }
    $('msg').textContent = `${d.me.displayName}: ${d.me.loans.edges.length} loans`;
    $('list').replaceChildren(...d.me.loans.edges.map(({ node: l }) => { const c = document.createElement('div'); c.className = 'card'; c.textContent = `${l.tool.name}: ${l.status}, due ${l.dueAt.slice(0, 10)}`; return c; }));
    $('more').hidden = true;
  };
  load(true);
}
start();
</script>
</body>
</html>
