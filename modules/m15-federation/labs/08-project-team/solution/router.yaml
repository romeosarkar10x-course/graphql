# Apollo Router for the federated Shelfie stack (compose.yaml and the lab test).
supergraph:
  introspection: true
health_check:
  listen: 0.0.0.0:8088
  enabled: true
include_subgraph_errors:
  all: true
headers:
  all:
    request:
      operations:
        - propagate:
            named: x-shelfie-user
        - propagate:
            named: authorization
