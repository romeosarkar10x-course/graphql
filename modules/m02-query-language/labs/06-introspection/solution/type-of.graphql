query TypeOfClub {
  __type(name: "Club") {
    name
    kind
    fields {
      name
      args {
        name
        defaultValue
      }
      type {
        kind
        name
        ofType {
          kind
          name
          ofType {
            kind
            name
            ofType {
              kind
              name
            }
          }
        }
      }
    }
  }
}
