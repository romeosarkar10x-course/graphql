# Lab 13.7: a browsable docs site from the SDL alone, no running server needed.
#   bin/course node npm run docs   ->   docs/public/index.html
spectaql:
  targetDir: docs/public
  # one file, no external fonts or scripts, so it opens from disk
  oneFile: true
introspection:
  schemaFile: src/main/resources/graphql/shelfie.graphqls
  # examples come from the descriptions; nothing is generated from a live server
  spectaqlDirective:
    enable: false
info:
  title: Shelfie GraphQL API
  description: |
    Book clubs, books and reviews. Send `X-Shelfie-User: <user id>` to act as a user.
    Writes come back with `userErrors` instead of GraphQL errors when a rule is broken.
servers:
  - url: http://localhost:4000/graphql
    description: Local (bin/course, port 4000)
    production: true
