server.port: 4000
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # From lab 10.2 on, tokens are verified offline with the course public key: no Keycloak needed.
          public-key-location: classpath:course-public.pem
          # "iss" is checked by SecurityConfig.courseIssuer(): issuer-uri here would make Spring Boot 4.2
          # fetch Keycloak\'s discovery document, even with the public key above.
          audiences: shelfie-api
          principal-claim-name: preferred_username
          authorities-claim-name: roles
          authority-prefix: ROLE_
  graphql:
    websocket:
      path: /graphql
    cors:
      # Only Shelfie's own web app may call from a browser. Bearer tokens travel in a header, so no
      # credentials (cookies) are allowed cross-origin at all. The same list decides which origins
      # may open a WebSocket (Spring refuses the handshake from any other origin with 403).
      allowed-origins: https://shelfie.test
      allowed-methods: POST
      allowed-headers: Content-Type, Authorization
