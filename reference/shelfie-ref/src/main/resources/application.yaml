server:
  port: 8080
spring:
  application:
    name: shelfie-ref
  servlet:
    multipart:
      max-file-size: 100MB      # Module 4.6 uploads a 50 MB cover
      max-request-size: 110MB
  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true   # GET /graphql/schema returns the SDL
    http:
      path: /graphql
management:
  endpoints:
    web:
      exposure:
        include: health
shelfie:
  grpc:
    port: 9090
  storage:                  # SeaweedFS in docker/compose.yaml (Module 4.6)
    endpoint: http://storage:8333
    bucket: covers
    access-key: shelfie
    secret-key: shelfie-secret
