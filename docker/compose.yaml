# Course services. Started by `bin/course ref up`; do not run by hand unless you know why.
#   shelfie-ref  reference server: REST /api, GraphQL /graphql, GraphiQL /graphiql, gRPC :9090
#   toxiproxy    adds latency between you and shelfie-ref (Module 1.2): proxy on :8666, API on :8474
#   storage      S3-compatible object storage for pre-signed cover uploads (Module 4.6): S3 API on :8333.
#                SeaweedFS, because MinIO (the plan's choice) no longer publishes container images.
#   postgres     PostgreSQL for Module 8 on (keyset paging, EXPLAIN ANALYZE, full-text search): :5432,
#                database/user/password shelfie. Inside the image: postgres:5432.
name: gqlcourse

services:
  shelfie-ref:
    image: graphql-course:1
    user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
    working_dir: /course
    volumes:
      - ..:/course
    command: ["java", "-XX:TieredStopAtLevel=1", "-jar", "reference/shelfie-ref/target/shelfie-ref.jar"]
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  storage:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 60

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: shelfie
      POSTGRES_USER: shelfie
      POSTGRES_PASSWORD: shelfie
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shelfie", "-d", "shelfie"]
      interval: 2s
      timeout: 2s
      retries: 60

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports:
      - "8474:8474"
      - "8666:8666"

networks:
  default:
    name: gqlcourse
